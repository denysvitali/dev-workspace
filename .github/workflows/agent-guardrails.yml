name: Agent guardrails
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent guidance and checkpoint regressions
        run: |
          python3 scripts/check_agent_guidance.py
          python3 -m unittest discover -s scripts -p 'test_agent*.py' -v
